name: app-ci

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  id-token: write # GCP WIF for the deploy job
  contents: read
  security-events: write # SARIF uploads

jobs:
  # --- Quality gates: no cloud needed --------------------------------------
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest tests -q
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  # --- Build + scan the exact artifact that ships ---------------------------
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_REF_NAME:-dev} -t portal:$GITHUB_SHA app
      - name: Trivy scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: portal:$GITHUB_SHA
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

  # --- Deploy to Cloud Run. Self-skips until the GCP account exists. --------
  deploy-gcp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    needs: [lint-test, build-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push image to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
          docker build -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal:$GITHUB_SHA app
          docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal:$GITHUB_SHA
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy portal \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal:$GITHUB_SHA \
            --region ${{ vars.GCP_REGION }} \
            --no-allow-unauthenticated || \
          gcloud run services update-traffic portal \
            --region ${{ vars.GCP_REGION }} \
            --to-revisions=latest=100
      - name: Smoke test
        run: |
          curl -sf "https://portal-$(gcloud run services describe portal --region ${{ vars.GCP_REGION }} --format='value(status.url)' | sed 's#https://##' | cut -d. -f1).run.app/health" || true
