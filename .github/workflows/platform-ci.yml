name: platform-ci

on:
  pull_request:
    paths: ["platform/**", "terraform/**", "workflows/**", ".github/workflows/platform-ci.yml"]
  push:
    branches: [main]
    paths: ["platform/**", "terraform/**", "workflows/**", ".github/workflows/platform-ci.yml"]
  workflow_dispatch:
    inputs:
      apply_gcp:
        description: "Apply platform/gcp (only when the GCP account exists)"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # --- Static checks: zero credentials (this is the code-first proof) -------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --chdir=platform/gcp
          tflint --chdir=terraform/aws
          tflint --chdir=terraform/gcp
          tflint --chdir=terraform/modules/aws-request
          tflint --chdir=terraform/modules/gcp-request
      - uses: raven-actions/actionlint@v2

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [platform/gcp, terraform/aws, terraform/gcp]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  # --- GCP apply: manual, only once the account exists ----------------------
  apply-gcp:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_gcp && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/gcp
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.15"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
      - name: terraform apply
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_PLATFORM_STATE_BUCKET }}" \
            -backend-config="prefix=platform/gcp" \
            -input=false
          terraform apply -auto-approve -input=false
