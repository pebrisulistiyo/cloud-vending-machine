name: release

# Semver tags only: push vMAJOR.MINOR.PATCH to cut a release.
# The full gate chain runs again, the image is tagged with both the version
# and the SHA, the deploy job runs when GCP is live (otherwise it shows as
# skipped), and a GitHub Release is always published.
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # GCP WIF
  contents: write # GitHub Release

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest tests -q
      - name: pip-audit
        run: pip-audit

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (version from tag)
        run: docker build --build-arg APP_VERSION=${{ github.ref_name }} -t portal:${{ github.ref_name }} app
      - name: Trivy scan (block CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: portal:${{ github.ref_name }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

  deploy:
    needs: build
    # Self-skips until the GCP account exists (code-first).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push image (version + SHA tags)
        run: |
          BASE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
          docker build --build-arg APP_VERSION=${{ github.ref_name }} \
            -t $BASE:${{ github.ref_name }} -t $BASE:${{ github.sha }} app
          docker push $BASE:${{ github.ref_name }}
          docker push $BASE:${{ github.sha }}
      - name: Deploy (SHA tag, same discipline as app-ci)
        run: |
          gcloud run deploy portal \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --no-allow-unauthenticated || \
          gcloud run services update-traffic portal \
            --region ${{ vars.GCP_REGION }} \
            --to-revisions=latest=100

  publish-release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
